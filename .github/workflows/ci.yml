name: CI

on:
  push:
    branches: [main, develop]
  # No base-branch filter, on purpose: a stacked PR targets a feature branch, not
  # develop/main, and with a filter here it would get no CI at all until it
  # retargeted develop on merge. Every PR gets the quality, integration and smoke
  # tiers regardless of where it's headed; the heavy nightly tiers stay gated by
  # event name below.
  pull_request:
  # Nightly run for the heavy end-to-end tier. 07:00 UTC daily.
  schedule:
    - cron: "0 7 * * *"
  # Manual trigger so the full E2E suite can be run on demand as a pre-release gate.
  workflow_dispatch:

# Tiered testing strategy (see /thoughts/test-tiers):
#   quality      - fast tier: lint, typecheck, dead-code, unit tests. Every push/PR.
#   e2e-smoke    - thin smoke subset (@smoke) in a real browser. Every push/PR.
#   integration  - component/route + data-layer Vitest tests. Every push/PR + nightly.
#   e2e-full     - heavy tier: full public + authenticated E2E + a11y. Nightly / on demand.
# Cheap checks gate the heavier jobs via needs: quality, so we never spend
# integration or E2E minutes on a change that doesn't lint, typecheck, or pass
# the unit suite.

jobs:
  quality:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      # Fails the build on unused dependencies (depcheck) and dead exports
      # (ts-prune). Known false positives are configured in .depcheckrc.json
      # and .ts-prunerc.json. See plans/tree-shaking-guide.md.
      - name: Dead-code check
        run: pnpm deadcheck

      - name: Run tests
        run: pnpm test

  integration:
    name: Integration tests (every push/PR + nightly)
    runs-on: ubuntu-latest
    needs: quality
    # Component + data-layer Vitest tests (react-query + MSW). The textbook tier
    # gates these on merge, but here they run in milliseconds, so we deliberately
    # keep them on every push and PR (no event filter) as well as nightly — the
    # per-PR cost is trivial and it's better to catch a wiring bug on the PR than
    # after it lands. See the note in /thoughts/test-tiers.

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run integration tests
        run: pnpm test:integration

  e2e-smoke:
    name: E2E smoke (public, every push/PR)
    runs-on: ubuntu-latest
    needs: quality
    # Thin smoke subset on every push and PR. The full suite runs nightly, so
    # skip this job on the scheduled/manual runs to avoid doing the smoke flows twice.
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    env:
      AUTH0_SECRET: ${{ secrets.AUTH0_SECRET || 'ci-placeholder-secret-32-characters!!' }}
      AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN || 'placeholder.auth0.com' }}
      AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID || 'ci-placeholder-client-id' }}
      AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET || 'ci-placeholder-client-secret' }}
      AUTH0_AUDIENCE: ${{ secrets.AUTH0_AUDIENCE || 'https://placeholder-api' }}
      APP_BASE_URL: "http://localhost:3000"
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers (Chromium only)
        run: pnpm exec playwright install chromium --with-deps

      - name: Run @smoke e2e tests
        env:
          # Public-only run — globalSetup skips the Auth0 login without credentials.
          E2E_TEST_EMAIL: ""
          E2E_TEST_PASSWORD: ""
        # --grep @smoke keeps this to the thin subset; --grep-invert @flaky keeps
        # quarantined tests off the blocking path.
        run: pnpm exec playwright test --project=public --grep @smoke --grep-invert @flaky

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke
          path: playwright-report/
          retention-days: 7

  e2e-full:
    name: E2E & Accessibility full (nightly / pre-release)
    runs-on: ubuntu-latest
    needs: quality
    # Heavy tier: the full public + authenticated flows. Runs nightly on a
    # schedule or on demand before a release, never on individual commits.
    # Also on release PRs. This job calls itself a pre-release gate, and it was
    # skipping the one PR that is actually a release -- a develop -> main PR is
    # neither a schedule nor a dispatch, so the heavy tiers sat out the merge
    # they exist to protect. Releases are rare, so the extra minutes are cheap.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.base_ref == 'main')

    # Real secrets (from repo Settings → Secrets) are used when available.
    # Placeholder fallbacks let the server boot in forks or repos where secrets
    # are not yet configured — the public E2E tests never perform real auth, so
    # the SDK only needs to initialise, not contact Auth0.
    env:
      AUTH0_SECRET: ${{ secrets.AUTH0_SECRET || 'ci-placeholder-secret-32-characters!!' }}
      AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN || 'placeholder.auth0.com' }}
      AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID || 'ci-placeholder-client-id' }}
      AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET || 'ci-placeholder-client-secret' }}
      AUTH0_AUDIENCE: ${{ secrets.AUTH0_AUDIENCE || 'https://placeholder-api' }}
      APP_BASE_URL: "http://localhost:3000"
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
      # Authenticated tests run when E2E credentials are configured.
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers (Chromium only)
        run: pnpm exec playwright install chromium --with-deps

      - name: Run public e2e tests (includes axe accessibility scans)
        env:
          # Override credentials for public-only run so globalSetup skips
          # the Auth0 login — public tests don't need authentication.
          E2E_TEST_EMAIL: ""
          E2E_TEST_PASSWORD: ""
        # @flaky is quarantined (own non-blocking step below). @operator-write is
        # excluded because this job runs against the deployed API and those specs
        # drive a write flow -- production is the wrong target for that, and the
        # e2e-operator-live job covers them properly against its own Postgres.
        run: pnpm exec playwright test --project=public --grep-invert "@flaky|@operator-write"

      - name: Run authenticated e2e tests
        if: env.E2E_TEST_EMAIL != ''
        run: pnpm exec playwright test --project=authenticated --grep-invert @flaky

      - name: Run quarantined @flaky tests (non-blocking)
        # Quarantined tests still get exercised nightly, but a failure here never
        # fails the build — flakes are fixed on their own clock, not by blocking merges.
        continue-on-error: true
        run: pnpm exec playwright test --grep @flaky

      - name: Upload Playwright report & auth debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            e2e/.auth/auth-failure.png
          retention-days: 7

  # ---------------------------------------------------------------------------
  # The tier that actually proves the operator feature talks to a database.
  #
  # Every other operator test runs against the BFF's in-memory seed, which is
  # the same fallback that keeps the demo alive when the API is asleep -- and
  # therefore the same fallback that hides whether the real path works. That is
  # not hypothetical: it let a missing /stores/:id/sales endpoint sit unnoticed,
  # and it made the restock specs pass identically whether or not a backend was
  # reachable. This job stands up Postgres and a real portfolio_api, points the
  # BFF at it, and drives the flow end to end, so an integration regression has
  # somewhere to fail.
  # ---------------------------------------------------------------------------
  e2e-operator-live:
    name: Operator E2E against a real backend
    runs-on: ubuntu-latest
    needs: quality
    # Also on release PRs. This job calls itself a pre-release gate, and it was
    # skipping the one PR that is actually a release -- a develop -> main PR is
    # neither a schedule nor a dispatch, so the heavy tiers sat out the merge
    # they exist to protect. Releases are rare, so the extra minutes are cheap.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.base_ref == 'main')

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: portfolio
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/portfolio
      # Both sides must agree or every write 401s while reads carry on, which is
      # exactly the partial outage the service token docs warn about.
      OPERATOR_SERVICE_TOKEN: ci-operator-service-token
      NEXT_PUBLIC_API_URL: http://localhost:3001
      APP_BASE_URL: http://localhost:3000
      AUTH0_SECRET: ci-placeholder-secret-32-characters!!
      AUTH0_DOMAIN: placeholder.auth0.com
      AUTH0_CLIENT_ID: ci-placeholder-client-id
      AUTH0_CLIENT_SECRET: ci-placeholder-client-secret
      AUTH0_AUDIENCE: https://placeholder-api
      # Public tier only; globalSetup skips the Auth0 login when these are blank.
      E2E_TEST_EMAIL: ""
      E2E_TEST_PASSWORD: ""
      # Resolve the store off the fleet instead of the seed id, so the specs
      # drive whatever the API is really serving.
      OPERATOR_E2E_LIVE: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Check out portfolio_api
        uses: actions/checkout@v4
        with:
          repository: gpbsumido/portfolio_api
          # Always test against the API's main, because main is what is actually
          # deployed and the operator dashboard only ever talks to the deployed
          # backend. This job runs on the nightly schedule, on demand, and on
          # release PRs -- every one of those wants the deployed API, not the
          # unreleased develop. Pinning develop said nothing about whether the
          # version in production can serve the screens, and worse, a develop ->
          # main release merge auto-deletes that branch, so the first nightly
          # after a backend release failed here fetching a develop that no longer
          # existed. main is release-only and always present.
          ref: main
          path: api

      - name: Prefer a portfolio_api branch of the same name
        working-directory: api
        # A frontend change that needs a backend change is developed as a pair of
        # same-named branches, so this job tests the pair rather than pinning the
        # new frontend against the deployed API. Falls back to main when there is
        # no counterpart, which is the common case.
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Testing against portfolio_api branch $BRANCH"
            git fetch --depth 1 origin "$BRANCH"
            git checkout FETCH_HEAD
          else
            echo "No portfolio_api branch named $BRANCH; testing against main"
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve the API's own pnpm
        working-directory: api
        # The two repos pin different pnpm majors -- this one is on 8 with a v6
        # lockfile, the API on 10 with a v9 one -- so the pnpm set up above
        # cannot install the API at all. Read the API's pin rather than
        # hardcoding it, which would silently drift the next time it upgrades.
        run: echo "API_PNPM=$(node -p 'require("./package.json").packageManager')" >> "$GITHUB_ENV"

      - name: Install API dependencies
        working-directory: api
        run: npx --yes "$API_PNPM" install --frozen-lockfile

      - name: Apply migrations and seed the operator tables
        working-directory: api
        env:
          # Migration 020 encrypts the stored Google OAuth tokens and refuses to
          # run without a key, which is right in production and broke CI. This
          # database is created empty and thrown away, so the value only has to
          # be a valid 32-byte hex string. Deliberately a literal rather than a
          # secret: it protects nothing, and an obviously-fake value cannot be
          # mistaken for the real one.
          TOKEN_ENCRYPTION_KEY: "deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef"
        run: |
          npx --yes "$API_PNPM" migrate
          npx --yes "$API_PNPM" seed:operator

      - name: Build and start portfolio_api
        working-directory: api
        env:
          PORT: 3001
          NEXT_PUBLIC_AUTH0_AUDIENCE: https://placeholder-api
          NEXT_PUBLIC_AUTH0_ISSUER_BASE_URL: https://placeholder.auth0.com
        run: |
          npx --yes "$API_PNPM" build
          node dist/index.js > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3001/api/health >/dev/null && break
            sleep 2
          done
          curl -sf http://localhost:3001/api/health || {
            echo "::error::portfolio_api did not come up"
            cat "$RUNNER_TEMP/api.log"
            exit 1
          }

      - name: Install Playwright browsers (Chromium only)
        run: pnpm exec playwright install chromium --with-deps

      - name: Drive the operator flow against the live API
        run: pnpm exec playwright test --project=public e2e/public/operator-restock.spec.ts

      - name: API log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/api.log" || true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: operator-live-playwright-report
          path: playwright-report/
          retention-days: 7
